name: Stem server

on:
  push:
    paths:
      - 'stem-server/**'
      - '.github/workflows/stem-server.yml'
  pull_request:
    paths:
      - 'stem-server/**'
      - '.github/workflows/stem-server.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stem-server

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          # Same as the Dockerfile's base image.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: stem-server/requirements-test.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: Lint
        run: ruff check --isolated --target-version py312 --line-length 120 --select E,F,W,B,I,UP --ignore B008 app.py test_app.py

      - name: Test
        run: python -m pytest -q test_app.py
