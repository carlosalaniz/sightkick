# SightKick web image: the static site, plus /stem-api/ when SK_STEM_UPSTREAM
# is set (written at startup by 40-sightkick-stem-proxy.sh).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/sightkick/*.conf;

    # The page and the files that name a build are checked with the server on
    # every load (no-cache revalidates, it doesn't stop caching), so an open
    # tab or the installed app picks up a deploy on its next load.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Vite puts a content hash in every file name here: safe to keep for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # nginx's MIME list has no .webmanifest (it would go out as
    # application/octet-stream).
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }
}
