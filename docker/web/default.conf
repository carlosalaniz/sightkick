# SightKick web image: the static site, plus /stem-api/ when SK_STEM_UPSTREAM
# is set (written at startup by 40-sightkick-stem-proxy.sh).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/sightkick/*.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # nginx's MIME list has no .webmanifest (it would go out as
    # application/octet-stream).
    location ~ \.webmanifest$ {
        default_type application/manifest+json;
        try_files $uri =404;
    }
}
