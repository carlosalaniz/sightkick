apiVersion: harbor/v1alpha1
kind: Application
metadata:
  id: sightkick
  name: "SightKick"
  description: "Drum practice with sheet music: plays Clone Hero charts as notation, listens to your e-kit over MIDI and scores your playing. Includes a stem server that splits songs so you can mute the drums. Use Chrome or Edge; it has no login of its own."
release:
  revision: "1"
  version: "0.1.0"
  # cpu_shares on the stem server (decision 205)
  minHarbor: "0.47.0"
deployment:
  compose: compose.yaml
  multiInstance: false
  services:
    web: application
    stem-server: infrastructure
endpoints:
  web:
    service: web
    containerPort: 80
    scheme: http
    exposure: direct
    # The song library (browser storage / File System Access) and Web MIDI only exist on
    # secure origins, so over plain http the app cannot keep songs or hear the kit.
    browserContext: secure
    httpsRequired: true
health:
  endpoint: web
  path: /
  expectedStatus: [200]
  timeoutSeconds: 5
  deadlineSeconds: 120
ui:
  primaryEndpoint: web
# No setup block: Harbor reads `setup` as "the first visitor creates an account", and
# SightKick has no accounts. It has no login either, so put Harbor's app login in front
# of it before publishing it on the internet (harbor app-login sightkick on).
storage:
  - id: models
    composeVolume: models
    purpose: "Song-splitting models, downloaded on first use (about 80 MB, up to 1.3 GB with the Best and drum-kit models)"
    retention: retain
  - id: split-cache
    composeVolume: cache
    purpose: "Every song split so far, kept so the same song is never split twice. Only grows."
    retention: retain
    external: {hint: "Pick a folder with room, e.g. /srv/harbor/SightKick. Each split song takes about 20 to 50 MB.", required: false, readOnly: false}
presentation:
  tagline: Drum practice with real sheet music
  category: media
  icon: icon.png
  developer: Carlos Alaniz
  website: https://sightkick.dev
  source: https://github.com/carlosalaniz/sightkick
  releaseNotes: "First Harbor release: the browser version with its stem server, which caches every split on this machine."
  sizeHint: About 3 GB of images, plus models and splits
